name: Manual dashboard visit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-dashboard-visit
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Visit dashboard and wait for data
        run: python -u scripts/visit_site.py
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-visit-diagnostics
          path: visit-results/
          retention-days: 7
